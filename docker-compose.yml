services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes: [hotel-postgres:/var/lib/postgresql/data]
  mongo:
    image: mongo:8
    ports: ['27017:27017']
    volumes: [hotel-mongo:/data/db]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  hotel-postgres:
  hotel-mongo:
